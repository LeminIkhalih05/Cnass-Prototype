<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Connexion : CNASS Prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#2A1260;--card:#FFFFFF;--ink:#1B1830;--muted:#5E5A72;--rule:#DCDDE5;--purple:#5B2BB5;--orange:#E8903A;--err:#C23B3B;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#1F1C29;--ink:#F1EFF7;--muted:#A7A2BA;--rule:#34303F;--purple:#9D7BF0}}
:root[data-theme="dark"]{--card:#1F1C29;--ink:#F1EFF7;--muted:#A7A2BA;--rule:#34303F;--purple:#9D7BF0}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,"Segoe UI",Arial,sans-serif;display:grid;place-items:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--card);border-radius:18px;padding:36px 32px 32px}
.brand{font:700 15px "Barlow Condensed",Arial,sans-serif;letter-spacing:.14em;color:var(--orange);margin:0 0 10px}
h1{font:700 34px/1 "Barlow Condensed",Arial,sans-serif;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 28px}
label{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
input{width:100%;font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--rule);border-radius:10px;padding:12px 14px;margin:0 0 18px}
input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px color-mix(in srgb,var(--purple) 20%,transparent)}
button{width:100%;font:600 16px Barlow,Arial,sans-serif;color:#fff;background:var(--purple);border:0;border-radius:10px;padding:13px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.err{color:var(--err);font-size:14px;min-height:21px;margin:12px 0 0}
.foot{color:var(--muted);font-size:13px;margin:22px 0 0;text-align:center}
</style>
</head>
<body>
<main class="card">
  <p class="brand">CNASS × STARTAI</p>
  <h1>Espace projet</h1>
  <p class="lead">Accès réservé aux équipes CNASS et STARTAI.</p>
  <form id="f" novalidate>
    <label for="u">Identifiant</label>
    <input id="u" name="user" autocomplete="username" required autofocus>
    <label for="p">Mot de passe</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">Se connecter</button>
    <p class="err" id="e" role="alert"></p>
  </form>
  <p class="foot">Identifiants oubliés ? Contactez l'équipe STARTAI.</p>
</main>
<script>
const f = document.getElementById('f'), b = document.getElementById('b'), e = document.getElementById('e');
f.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  e.textContent = '';
  const user = f.user.value.trim(), password = f.password.value;
  if (!user || !password) { e.textContent = 'Renseignez l\'identifiant et le mot de passe.'; return; }
  b.disabled = true; b.textContent = 'Connexion…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, password }) });
    const d = await r.json().catch(() => ({}));
    if (r.ok && d.ok) {
      const next = new URLSearchParams(location.search).get('next');
      location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
      return;
    }
    e.textContent = d.error || 'Connexion impossible. Réessayez.';
  } catch { e.textContent = 'Serveur injoignable. Vérifiez votre connexion.'; }
  b.disabled = false; b.textContent = 'Se connecter';
});
</script>
</body>
</html>
